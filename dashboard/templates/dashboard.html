<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Inanstech WhatsApp Bot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #0D47A1; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>WhatsApp Bot Dashboard</h1>
    <h2>Users</h2>
    <pre>{{ users | tojson(indent=2) }}</pre>

    <h2>Leads</h2>
    <pre>{{ leads | tojson(indent=2) }}</pre>

    <h2>Messages</h2>
    <pre>{{ messages | tojson(indent=2) }}</pre>

    <h2>Logs</h2>
    <pre>{{ logs | tojson(indent=2) }}</pre>
</body>
</html>
