<!DOCTYPE html>
<html>
<head>
    <title>Inanstech WhatsApp Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            color: #333;
        }
        .qr-code {
            max-width: 250px;
            margin: 20px auto;
            display: block;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .connected {
            background: #d4edda;
            color: #155724;
        }
        .waiting {
            background: #fff3cd;
            color: #856404;
        }
        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Inanstech WhatsApp Bot</h1>
        <div id="status" class="status waiting">⏳ Waiting for connection...</div>
        <div id="qrDisplay"><p>Loading QR code...</p></div>
        <button onclick="location.reload()">Refresh</button>
    </div>
    <script>
        function update() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    const status = document.getElementById('status');
                    if (data.connected) {
                        status.innerHTML = '✅ Connected! Bot is active.';
                        status.className = 'status connected';
                    }
                });
            fetch('/api/qr')
                .then(res => res.json())
                .then(data => {
                    if (data.qr && !data.connected) {
                        document.getElementById('qrDisplay').innerHTML = `<img src="${data.qr}" class="qr-code">`;
                    }
                });
        }
        update();
        setInterval(update, 3000);
    </script>
</body>
</html>
