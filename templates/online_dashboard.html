<!DOCTYPE html>
<html>
<head>
    <title>Inanstech WhatsApp Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .qr-container {
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .qr-code {
            max-width: 250px;
            margin: 0 auto;
            display: block;
        }
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
        }
        .connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .waiting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>Inanstech WhatsApp Bot</h1>
        <p>AI-Powered Customer Service Assistant</p>
        
        <div id="status" class="status waiting">
            ⏳ Waiting for connection...
        </div>
        
        <div class="qr-container">
            <div id="qrDisplay">
                <p>Loading QR code...</p>
            </div>
        </div>
        
        <button onclick="location.reload()">Refresh</button>
        
        <div class="footer">
            <p>Scan QR code with WhatsApp to connect</p>
            <p>Settings → Linked Devices → Link a Device</p>
        </div>
    </div>
    
    <script>
        let lastQr = null;
        
        function updateStatus() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    const statusDiv = document.getElementById('status');
                    if (data.connected) {
                        statusDiv.innerHTML = '✅ WhatsApp Connected! Bot is active.';
                        statusDiv.className = 'status connected';
                        document.getElementById('qrDisplay').innerHTML = '<p style="color: #155724;">✅ Connected! You can now use the bot.</p>';
                    }
                })
                .catch(err => console.error('Status error:', err));
        }
        
        function loadQR() {
            fetch('/api/qr')
                .then(res => res.json())
                .then(data => {
                    if (data.connected) {
                        document.getElementById('qrDisplay').innerHTML = '<p>✅ Connected! Bot is active.</p>';
                        return;
                    }
                    
                    if (data.qr && data.qr !== lastQr) {
                        lastQr = data.qr;
                        document.getElementById('qrDisplay').innerHTML = `
                            <img src="${data.qr}" class="qr-code" alt="QR Code">
                            <p style="margin-top: 10px;">Scan with WhatsApp</p>
                        `;
                    } else if (!data.qr) {
                        document.getElementById('qrDisplay').innerHTML = '<p>Loading QR code...</p>';
                    }
                })
                .catch(err => console.error('QR error:', err));
        }
        
        updateStatus();
        loadQR();
        setInterval(updateStatus, 3000);
        setInterval(loadQR, 5000);
    </script>
</body>
</html>
